<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trishula Netra 1.0 — Sovereign Telemetry Cockpit</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#00e5ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #080c14; color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #hud-bar {
      height: 36px; background: #0c121e; border-bottom: 1px solid #1e293b;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 12px; font-size: 11px; font-family: monospace; z-index: 100;
    }
    .hud-title { color: #00e5ff; font-weight: 800; display: flex; align-items: center; gap: 6px; }
    .pulse-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #00ff9d;
      box-shadow: 0 0 8px #00ff9d; animation: pulse 2s infinite;
    }
    @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
    .hud-right { display: flex; align-items: center; gap: 10px; }
    .hud-link {
      color: #94a3b8; text-decoration: none; border: 1px solid #334155;
      padding: 2px 8px; border-radius: 4px; font-size: 10px; transition: all 0.2s;
    }
    .hud-link:hover { border-color: #00e5ff; color: #00e5ff; }
    #cockpit-frame {
      width: 100%; height: calc(100% - 36px); border: none; background: #080c14;
    }
    #loader {
      position: absolute; top: 36px; left: 0; width: 100%; height: calc(100% - 36px);
      background: #080c14; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; z-index: 50;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 36px; height: 36px; border: 3px solid #1e293b;
      border-top-color: #00e5ff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .load-text { font-size: 13px; color: #94a3b8; font-family: monospace; }
  </style>
</head>
<body>
  <div id="hud-bar">
    <div class="hud-title">
      <div class="pulse-dot" id="status-dot"></div>
      <span>NETRA PERMANENT RELAY</span>
      <span id="route-indicator" style="color: #64748b; font-size: 9px;">[CONNECTING]</span>
    </div>
    <div class="hud-right">
      <a href="#" id="direct-btn" target="_blank" class="hud-link">Direct Ingress ↗</a>
      <a href="#" id="reconnect-btn" class="hud-link" onclick="discoverAndMount(true); return false;">Sync ↻</a>
    </div>
  </div>

  <div id="loader">
    <div class="spinner"></div>
    <div class="load-text" id="loader-msg">Resolving Active Netra Ingress...</div>
  </div>

  <iframe id="cockpit-frame" sandbox="allow-forms allow-modals allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-downloads"></iframe>

  <script>
    const FRAME = document.getElementById('cockpit-frame');
    const LOADER = document.getElementById('loader');
    const STATUS_DOT = document.getElementById('status-dot');
    const ROUTE_IND = document.getElementById('route-indicator');
    const DIRECT_BTN = document.getElementById('direct-btn');
    const LOADER_MSG = document.getElementById('loader-msg');

    let currentTunnelUrl = localStorage.getItem('netra_last_tunnel') || '';

    async function discoverAndMount(forceRefresh = false) {
      LOADER_MSG.innerText = 'Syncing Live Gateway Socket...';
      LOADER.style.display = 'flex';
      LOADER.style.opacity = '1';

      try {
        const resp = await fetch('active_tunnel.json?t=' + Date.now(), { cache: 'no-store' });
        if (resp.ok) {
          const data = await resp.json();
          if (data && data.public_url) {
            currentTunnelUrl = data.public_url.replace(/\/$/, '');
            localStorage.setItem('netra_last_tunnel', currentTunnelUrl);
          }
        }
      } catch (err) {
        console.warn('[NETRA-RELAY] Local fetch note:', err);
      }

      if (!currentTunnelUrl) {
        currentTunnelUrl = 'https://undertake-bless-some-definition.trycloudflare.com';
      }

      DIRECT_BTN.href = currentTunnelUrl;
      ROUTE_IND.innerText = `[${currentTunnelUrl.replace('https://', '')}]`;
      ROUTE_IND.style.color = '#00ff9d';
      STATUS_DOT.style.background = '#00ff9d';
      STATUS_DOT.style.boxShadow = '0 0 8px #00ff9d';

      if (FRAME.src !== currentTunnelUrl + '/') {
        FRAME.src = currentTunnelUrl + '/';
      }

      FRAME.onload = () => {
        LOADER.style.opacity = '0';
        setTimeout(() => { LOADER.style.display = 'none'; }, 300);
      };
    }

    // Auto-discover on load
    discoverAndMount();

    // Background keep-alive & rotation listener every 60s
    setInterval(() => {
      fetch('active_tunnel.json?t=' + Date.now(), { cache: 'no-store' })
        .then(r => r.json())
        .then(d => {
          if (d && d.public_url && d.public_url.replace(/\/$/, '') !== currentTunnelUrl) {
            console.log('[NETRA-RELAY] Ingress rotation detected. Updating frame...');
            discoverAndMount(true);
          }
        }).catch(() => {});
    }, 60000);
  </script>
</body>
</html>
